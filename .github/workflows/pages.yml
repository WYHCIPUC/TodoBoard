name: Deploy online demo

on:
  push:
    branches: [main]
    paths:
      - "board.html"
      - "board.css"
      - "board.js"
      - "DATA.example.md"
      - "lib/brainstorm.js"
      - "scripts/build-demo.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build read-only demo
        run: node scripts/build-demo.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .demo-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
