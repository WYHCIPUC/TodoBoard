name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character candidate commit SHA
        required: true
        type: string
      version:
        description: Exact package version
        required: true
        default: 2.3.0
        type: string

permissions:
  contents: read

jobs:
  validate-input:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.input.outputs.sha }}
    steps:
      - id: input
        env:
          CANDIDATE_SHA: ${{ inputs.commit_sha }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          echo "$CANDIDATE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  local-equivalent-gates:
    needs: validate-input
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-input.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci --ignore-scripts
      - name: Build native volume lock
        run: npm run build:native
      - shell: powershell
        run: |
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne "${{ inputs.version }}") { throw "Version mismatch" }
          if ((git rev-parse HEAD) -ne "${{ needs.validate-input.outputs.sha }}") { throw "Commit mismatch" }
      - run: npm run check
      - run: npm run coverage
      - run: npm run test:scrapers:fixtures
      - run: npm run test:e2e
      - name: Real browser trusted-recovery E2E
        run: |
          python -m pip install playwright==1.58.0
          python e2e/trusted-recovery-playwright.py
      - run: npm run test:launcher

  immutable-windows-assets:
    needs: [validate-input, local-equivalent-gates]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-input.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci --ignore-scripts
      - name: Build native volume lock
        run: npm run build:native
      - shell: powershell
        run: |
          .\scripts\recovery-drill.ps1 -EvidencePath "$env:RUNNER_TEMP\recovery-drill.json"
          .\scripts\build-executable.ps1 -OutputDirectory "$env:RUNNER_TEMP\candidate-a"
          .\scripts\build-executable.ps1 -OutputDirectory "$env:RUNNER_TEMP\candidate-b"
          .\scripts\smoke-executable.ps1 -ExecutablePath "$env:RUNNER_TEMP\candidate-a\linggankanban-${{ inputs.version }}-windows-x64.exe"
          .\scripts\release-drill.ps1 -ReleaseDirectory "$env:RUNNER_TEMP\candidate-a" -ComparisonDirectory "$env:RUNNER_TEMP\candidate-b" -EvidencePath "$env:RUNNER_TEMP\release-drill.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v${{ inputs.version }}-tested-assets-${{ needs.validate-input.outputs.sha }}
          path: |
            ${{ runner.temp }}/candidate-a/*
            ${{ runner.temp }}/recovery-drill.json
            ${{ runner.temp }}/release-drill.json
          if-no-files-found: error
          retention-days: 30

# Deliberately no tag, push, GitHub Release, or contents:write job here.
# Remote authentication, repository rules, existing tag/Release checks, exact
# asset review, protected-environment approval, and compensation rehearsal are
# external gates recorded as Pending in docs/RELEASE-CHECKLIST.md.
