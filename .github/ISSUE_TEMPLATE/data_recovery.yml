name: 数据恢复求助
description: 迁移、导入、恢复或数据异常相关问题
title: "[Recovery] "
labels: ["data-recovery"]
body:
  - type: markdown
    attributes:
      value: 请先停止写入，不要反复导入或覆盖文件。不要公开上传 DATA.md、完整备份、截图或密钥。
  - type: dropdown
    id: situation
    attributes:
      label: 问题发生在哪一步
      options: [启动迁移, 完整备份导出, 完整备份导入, 回收站恢复, 手工移动文件, 其他]
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: 已执行的操作
      description: 按时间顺序说明，不要包含用户正文。
    validations:
      required: true
  - type: textarea
    id: backups
    attributes:
      label: 可用备份
      description: 仅列出备份目录、文件名、日期和大小，不要上传文件本身。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 匿名诊断与错误
      description: 粘贴应用导出的诊断信息及错误消息，先移除敏感字段。
