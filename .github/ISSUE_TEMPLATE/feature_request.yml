name: 功能建议
description: 描述要解决的使用问题，而不只是解决方案
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 谁在什么情况下遇到了什么阻碍？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 完成后怎样判断问题已经解决？
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 当前替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 数据边界
      options:
        - label: 我理解当前版本是本地单机产品，不包含云同步或多人协作。
          required: true
