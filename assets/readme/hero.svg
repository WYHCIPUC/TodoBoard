<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">灵感工作台 · 本地优先的灵感收集与头脑风暴工具</title>
  <desc id="desc">把散落的链接变成可研究的本地项目库，再让不同项目的长处碰撞成新方案。</desc>

  <rect x="1" y="1" width="1198" height="398" rx="28" fill="#FAF9F6" stroke="#E7E3DB" stroke-width="2"/>

  <g id="brand" transform="translate(58 48)">
    <rect width="52" height="52" rx="14" fill="#FFF7F2" stroke="#E8B49A"/>
    <path d="M26 11c1.8 8 4.2 10.4 12 12-7.8 1.8-10.2 4.2-12 12-1.8-7.8-4.2-10.2-12-12 7.8-1.6 10.2-4 12-12Z" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="26" cy="23" r="2.8" fill="#C2410C"/>
  </g>

  <g id="title-block" transform="translate(58 126)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="0" fill="#C2410C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2.6">IDEA OS · LOCAL-FIRST</text>
    <text x="0" y="82" fill="#221D16" font-size="72" font-weight="780" letter-spacing="-2">灵感工作台</text>
    <text x="2" y="132" fill="#5D5649" font-size="27" font-weight="500">收集灵感，深入研究，碰撞出可执行的新方案</text>

    <g transform="translate(0 174)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <rect width="116" height="38" rx="19" fill="#221D16"/>
      <text x="58" y="25" fill="#FAF9F6" text-anchor="middle">LOCAL MD</text>
      <rect x="128" width="128" height="38" rx="19" fill="#FFFFFF" stroke="#CFC8BB"/>
      <text x="192" y="25" fill="#5D5649" text-anchor="middle">ZERO BUILD</text>
      <rect x="268" width="144" height="38" rx="19" fill="#FFFFFF" stroke="#CFC8BB"/>
      <text x="340" y="25" fill="#5D5649" text-anchor="middle">ONE DATA.md</text>
    </g>
  </g>

  <g id="project-flow" transform="translate(690 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <path d="M34 73H140M258 73h78M429 114v56" fill="none" stroke="#CFC8BB" stroke-width="2" stroke-dasharray="5 7"/>
    <circle cx="34" cy="73" r="5" fill="#C2410C"/>
    <circle cx="336" cy="73" r="5" fill="#C2410C"/>
    <circle cx="429" cy="170" r="5" fill="#C2410C"/>

    <g id="input-card" transform="translate(0 28)">
      <rect width="258" height="90" rx="18" fill="#FFFFFF" stroke="#DED8CE"/>
      <rect x="18" y="18" width="48" height="48" rx="12" fill="#F5F3EF"/>
      <path d="M32 48l10-10a8 8 0 0111 11l-7 7a6 6 0 01-8.5 0" fill="none" stroke="#C2410C" stroke-width="2.2" stroke-linecap="round"/>
